name: Build

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to package and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package Chrome and Firefox extensions
        run: pnpm build:packages

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/atarashii-tab-reborn-chrome.zip,dist/atarashii-tab-reborn-firefox.zip
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          immutableCreate: true
